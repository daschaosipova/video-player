<!DOCTYPE html>
<html>
<head>
  <title>Видео-плеер</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="static/font-awesome/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

  <link rel="icon" type="image/svg+xml" href="static/favicon/favicon.svg" />
  <link rel="icon" type="image/png" href="static/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="apple-touch-icon" sizes="180x180" href="static/favicon/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <style>
    /* Отступ от края браузера, как на макете дизайнера */
    body {
      margin: 8px;
    }

    /* Стиль для главного контейнера плеера */
    .player-main-wrapper {
      width: 800px;
      height: 600px;
      box-shadow: 0 0 25px black;
      display: flex;
      flex-direction: column;
      background-color: black;
    }

    /* Стиль для видео внутри плеера */
    .player-video-box {
      flex-grow: 1;
      margin-bottom: 3px;
    }

    /* Стиль для нижней панели управления */
    .player-controls-bar {
      background-color: black;
      display: flex;
      align-items: center;
      gap: 2px;
      padding-bottom: 4px;
    }

    /* Общий стиль для кнопок управления */
    .player-btn {
      background-color: transparent;
      cursor: pointer;
      border: none;
      width: 35px;
      height: 35px;
      padding-bottom: 0;
    }

    /* Рамка фокуса: видна только при клавиатурной навигации, не при клике мышью */
    .player-btn:focus-visible {
      outline: 2px solid white;
      outline-offset: 2px;
    }

    /* Стиль для иконок внутри кнопок */
    .player-icon {
      color: white;
      font-size: large;
    }

    /* Стиль для текста внутри кнопок */
    .player-text {
      color: white;
      font-family: 'Roboto', sans-serif;
      font-weight: 400;
    }

    /* Стиль для контейнера прогрессбара видео-плеера */
    .player-progress-bar {
      flex-grow: 1;
      margin-left: 7px;
      margin-right: 7px;
      display: flex;
      align-items: center;
    }

    /* Вся дорожка (серая подложка, фиксированная на 100% ширины контейнера) */
    .player-progress-fixed {
      background-color: black;
      height: 5px;
      border-radius: 30px;
      width: 100%;
      position: relative;
    }

    /* Стиль для полоски прогрессбара видео-плеера */
    .player-progress-slider {
      background-color: #f8104d;
      height: 100%;
      border-radius: 30px;
      position: relative;
    }

    /* Бегунок (точка), базовое состояние */
    .dot {
      height: 15px;
      width: 15px;
      background-color: #f8104d;
      opacity: 0;
      border-radius: 50%;
      border: 4px solid white;
      box-sizing: border-box;
      display: inline-block;
      flex-grow: 0;
      position: absolute;
      right: -7.5px;
      top: 50%;
      transform: translateY(-50%);
      transition-property: opacity;
      transition-duration: 300ms;
      transition-timing-function: ease-in;
    }

    /* Бегунок (точка), состояние при наведении курсора */
    .player-controls-bar:hover .dot {
      opacity: 1;
      transition-timing-function: ease-out;
    }
  </style>
</head>
<body>
  <div id="player" class="player-main-wrapper">
    <div class="js-video-container player-video-box"></div>

    <div class="player-controls-bar">
      <button class="js-play-button player-btn">
        <i class="fa fa-play player-icon" aria-hidden="true"></i>
      </button>

      <button class="js-pause-button player-btn" hidden>
        <i class="fa fa-pause player-icon" aria-hidden="true"></i>
      </button>

      <button class="js-mute-button player-btn" hidden>
        <i class="fa fa-volume-up player-icon" aria-hidden="true"></i>
      </button>

      <button class="js-volume-button player-btn" hidden>
        <i class="fa fa-volume-off player-icon" aria-hidden="true"></i>
      </button>

      <span class="js-current-time player-text"></span>

      <div class="js-progress player-progress-bar">
        <div class="player-progress-fixed">
          <div class="js-progress-slider player-progress-slider">
            <span class="dot"></span>
          </div>
        </div>
      </div>

      <span class="js-duration player-text"></span>

      <button class="js-fullscreen-button player-btn">
        <i class="fa fa-expand player-icon" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
  <script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
  <script src="static/js/player.js"></script>

  <script type="text/javascript">
    createPlayer({elementId: 'player'});
  </script>

</body>
</html>
