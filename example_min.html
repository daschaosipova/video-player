<!DOCTYPE html>
<html>
<head>
  <title>Пример подключения плеера</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="C:/Users/Reg12/Python stuff/video-player/font-awesome/css/font-awesome.min.css">
  
  <style>
    /* Стиль для главного контейнера плеера */
    .player-main-wrapper {
      width: 800px;
      height: 600px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
    }

    /* Стиль для видео внутри плеера */
    .player-video-box {
      flex-grow: 1;
    }

    /* Стиль для нижней панели управления */
    .player-controls-bar {
      background-color: black;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    /* Общий стиль для кнопок управления */
    .player-btn {
      background-color: transparent;
      cursor: pointer;
      border: none;
      outline: none;
    }

    /* Стиль для иконок внутри кнопок */
    .player-icon {
      color: white;
    }
  </style>
</head>
<body>

  <div id="player" class="player-main-wrapper">
    <div class="js-video-container player-video-box"></div>
    
    <div class="player-controls-bar">
      <button class="js-play-button player-btn">
        <i class="fa fa-play player-icon" aria-hidden="true"></i>
      </button>

      <button class="js-pause-button player-btn" hidden>
        <i class="fa fa-pause player-icon" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
  <script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
  <script src="player.js"></script>

  <script type="text/javascript">
    createPlayer({elementId: 'player'});
  </script>

</body>
</html>
